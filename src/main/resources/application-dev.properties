# =====================================================
# ============== Development Environment - SSO Enabled
# =====================================================
# This profile uses Azure AD (Entra) for SSO login

# =====================================================
# ============== Kramax Entra Identity Plugin =======
# =====================================================
plugin.identity.entra.tenant-id=${DEV_AZURE_TENANT_ID:${AZURE_TENANT_ID:dev-tenant-id}}
plugin.identity.entra.client-id=${DEV_AZURE_CLIENT_ID:${AZURE_CLIENT_ID:dev-client-id}}
plugin.identity.entra.client-secret=${DEV_AZURE_CLIENT_SECRET:${AZURE_CLIENT_SECRET:dev-client-secret}}
plugin.identity.entra.use-email-as-camunda-user-id=true
plugin.identity.entra.fallback-to-upn-when-mail-empty=true
plugin.identity.entra.use-group-display-name-as-camunda-group-id=true
plugin.identity.entra.transitive-group-membership=true
plugin.identity.entra.security-groups-only=true
plugin.identity.entra.administrator-group-name=kramax-admin
plugin.identity.entra.cache-enabled=false
plugin.identity.entra.fetch-groups-from-graph=true

#spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration,org.vodafone.kramax.bpm.spring.boot.starter.security.oauth2.KramaxSpringSecurityOAuth2AutoConfiguration

# =====================================================
# ============== Spring Security & OAuth2 ============
# =====================================================
spring.security.oauth2.client.registration.azure.client-id=${plugin.identity.entra.client-id}
spring.security.oauth2.client.registration.azure.client-secret=${plugin.identity.entra.client-secret}
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.redirect-uri=${DEV_AZURE_REDIRECT_URI:${AZURE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/azure}}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email

spring.security.oauth2.client.provider.azure.user-name-attribute=email
spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/${plugin.identity.entra.tenant-id}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/${plugin.identity.entra.tenant-id}/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/${plugin.identity.entra.tenant-id}/discovery/v2.0/keys
#spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/v1.0/me

# =====================================================
# ============== H2 Database Configuration ============
# =====================================================
spring.datasource.url=${DEV_DB_URL:${DB_URL:jdbc:h2:file:./data/gno;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${DEV_DB_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${DEV_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.h2.Driver


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

