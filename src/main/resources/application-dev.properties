# =====================================================
# ============== KramaX BPM Configuration ============
# =====================================================
# Enable identity provider plugin for Entra integration
kramax.bpm.identity-provider.enabled=true
kramax.bpm.identity-provider.group-name-attribute=kramax-admin

# OAuth2 Identity Provider Configuration (CRITICAL)
kramax.bpm.oauth2.identity-provider.enabled=true
kramax.bpm.oauth2.identity-provider.group-name-attribute=groups

# ===== CRITICAL: Enable Entra as Identity Provider =====
# This explicitly tells Kramax to use the Entra Identity Provider
# Instead of defaulting to DbIdentityServiceProvider
kramax.plugin.entra.enabled=true
kramax.bpm.oauth2.azure-sso-enabled=true
kramax.bpm.auto-deployment-enabled=false
kramax.bpm.database.schema-update=true


kramax.bpm.oauth2.post-login-redirect-uri="${SSO_POST_LOGIN_REDIRECT_URI:${KRAMAX_REACT_FRONTEND_BASE_URL:/kramax}/monitoring/dashboard}"
kramax.bpm.oauth2.post-login-failure-redirect-uri="${SSO_POST_LOGIN_FAILURE_REDIRECT_URI:${KRAMAX_REACT_FRONTEND_BASE_URL:/kramax}/login?error}"
kramax.bpm.oauth2.sso-logout.enabled=true
#kramax.bpm.oauth2.post-logout-redirect-uri="{baseUrl}"


# =====================================================
# ============== Multi-Engine Configuration ==========
# =====================================================
kramax.multi-engine.enabled=true
kramax.multi-engine.databaseSchemaUpdate=true

# App Datasources (required for multi-engine)
app.datasource.default.url=${DEV_DB_URL:${DB_URL:jdbc:h2:file:./data/gno;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE}}
app.datasource.default.username=${DEV_DB_USERNAME:${DB_USERNAME:sa}}
app.datasource.default.password=${DEV_DB_PASSWORD:${DB_PASSWORD:}}
app.datasource.default.driver-class-name=org.h2.Driver

# =====================================================
# ============== Logging ==============================
# =====================================================
logging.level.root=DEBUG
logging.level.com.vodafone.gno=DEBUG
logging.level.org.vodafone.kramax.bpm=DEBUG
logging.level.org.vodafone.kramax.bpm.extension.entra=TRACE
logging.level.org.vodafone.kramax.bpm.extension=TRACE
logging.level.org.vodafone.kramax.bpm.spring.boot.starter.security.oauth2=TRACE

kramax.bpm.authorization.enabled=false

