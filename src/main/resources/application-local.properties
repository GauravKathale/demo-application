# =====================================================
# ============== Local Environment - Non-SSO Enabled
# =====================================================
# This profile uses basic authentication (username/password)
# SSO is disabled for local development

# =====================================================
# ============== Spring Security & OAuth2 ============
# =====================================================
spring.autoconfigure.exclude=org.springframework.boot.security.oauth2.client.autoconfigure.servlet.OAuth2ClientWebSecurityAutoConfiguration,org.vodafone.kramax.bpm.spring.boot.starter.security.oauth2.KramaxSpringSecurityOAuth2AutoConfiguration

# Basic authentication for non-SSO local development
spring.security.user.name=${LOCAL_USERNAME:demo}
spring.security.user.password=${LOCAL_PASSWORD:demo}

# OAuth2 Configuration (optional for local, can be left as defaults)
spring.security.oauth2.client.registration.azure.client-id=${LOCAL_AZURE_CLIENT_ID:${AZURE_CLIENT_ID:local-client-id}}
spring.security.oauth2.client.registration.azure.client-secret=${LOCAL_AZURE_CLIENT_SECRET:${AZURE_CLIENT_SECRET:local-client-secret}}
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.redirect-uri=${LOCAL_AZURE_REDIRECT_URI:${AZURE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/azure}}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email

spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/${LOCAL_AZURE_TENANT_ID:${AZURE_TENANT_ID:local-tenant-id}}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/${LOCAL_AZURE_TENANT_ID:${AZURE_TENANT_ID:local-tenant-id}}/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/${LOCAL_AZURE_TENANT_ID:${AZURE_TENANT_ID:local-tenant-id}}/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-name-attribute=email

# =====================================================
# ============== H2 Database Configuration ============
# =====================================================
spring.datasource.url=${LOCAL_DB_URL:${DB_URL:jdbc:h2:file:./data/gno;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${LOCAL_DB_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${LOCAL_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.engine.url=${LOCAL_DB_ENGINE_URL:${DB_ENGINE_URL:jdbc:h2:file:./data/engine;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.engine.username=${LOCAL_DB_ENGINE_USERNAME:${DB_ENGINE_USERNAME:sa}}
spring.datasource.engine.password=${LOCAL_DB_ENGINE_PASSWORD:${DB_ENGINE_PASSWORD:}}
spring.datasource.engine.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

