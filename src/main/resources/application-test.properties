# =====================================================
# ============== Test Environment - SSO Enabled
# =====================================================
# This profile uses Azure AD (Entra) for SSO login
# Configuration optimized for automated testing

# =====================================================
# ============== Plugin Identity (Entra/AAD) =========
# =====================================================
plugin.identity.entra.tenant-id=${TEST_AZURE_TENANT_ID:${AZURE_TENANT_ID:test-tenant-id}}
plugin.identity.entra.client-id=${TEST_AZURE_CLIENT_ID:${AZURE_CLIENT_ID:test-client-id}}
plugin.identity.entra.client-secret=${TEST_AZURE_CLIENT_SECRET:${AZURE_CLIENT_SECRET:test-client-secret}}

# =====================================================
# ============== Spring Security & OAuth2 ============
# =====================================================
spring.security.oauth2.client.registration.azure.client-id=${plugin.identity.entra.client-id}
spring.security.oauth2.client.registration.azure.client-secret=${plugin.identity.entra.client-secret}
spring.security.oauth2.client.registration.azure.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.azure.redirect-uri=${TEST_AZURE_REDIRECT_URI:${AZURE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/azure}}
spring.security.oauth2.client.registration.azure.scope=openid,profile,email

spring.security.oauth2.client.provider.azure.authorization-uri=https://login.microsoftonline.com/${plugin.identity.entra.tenant-id}/oauth2/v2.0/authorize
spring.security.oauth2.client.provider.azure.token-uri=https://login.microsoftonline.com/${plugin.identity.entra.tenant-id}/oauth2/v2.0/token
spring.security.oauth2.client.provider.azure.jwk-set-uri=https://login.microsoftonline.com/${plugin.identity.entra.tenant-id}/discovery/v2.0/keys
spring.security.oauth2.client.provider.azure.user-name-attribute=email
#spring.security.oauth2.client.provider.azure.user-info-uri=https://graph.microsoft.com/v1.0/me

# =====================================================
# ============== H2 Database Configuration ============
# =====================================================
spring.datasource.url=${TEST_DB_URL:${DB_URL:jdbc:h2:file:./data/gno;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:sa}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.engine.url=${TEST_DB_ENGINE_URL:${DB_ENGINE_URL:jdbc:h2:file:./data/engine;TRACE_LEVEL_FILE=0;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.engine.username=${TEST_DB_ENGINE_USERNAME:${DB_ENGINE_USERNAME:sa}}
spring.datasource.engine.password=${TEST_DB_ENGINE_PASSWORD:${DB_ENGINE_PASSWORD:}}
spring.datasource.engine.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

